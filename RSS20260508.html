<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSS 信号流</title>
<style>
:root {
  --bg: #f7f4ef;
  --panel: #fffdf9;
  --ink: #1f1f1f;
  --muted: #6f6a63;
  --line: #ded8ce;
  --soft: #eef5f6;
  --soft2: #fff6f4;
  --accent: #2b6f77;
  --accent-ink: #0f4248;
  --chip: #fbfaf7;
  --shadow: 0 10px 30px rgba(50, 42, 32, .07);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
a { color: inherit; text-decoration: none; }
a:hover { color: var(--accent); text-decoration: underline; }
.page { width: min(1840px, calc(100vw - 42px)); margin: 18px auto 36px; }
.shell { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.hero { display: flex; justify-content: space-between; gap: 20px; align-items: flex-end; padding: 26px 28px 18px; border-bottom: 1px solid var(--line); }
.hero h1 { margin: 0; font-size: 28px; line-height: 1.1; letter-spacing: 0; }
.hero .sub { margin-top: 8px; color: var(--muted); font-size: 13px; }
.hero .total { font-size: 18px; color: var(--muted); white-space: nowrap; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.stat { padding: 15px 20px; border-right: 1px solid var(--line); background: #fffdfa; min-height: 82px; }
.stat:last-child { border-right: 0; }
.label { color: var(--muted); font-size: 12px; font-weight: 700; }
.value { margin-top: 8px; font-size: 24px; font-weight: 800; line-height: 1; }
.hint { margin-top: 8px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.controls { padding: 14px 20px 12px; border-bottom: 1px solid var(--line); background: #fffdfa; }
.search-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.search { flex: 1; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 0 12px; font-size: 14px; outline-color: var(--accent); }
.small-btn { border: 1px solid var(--line); background: var(--chip); color: var(--muted); border-radius: 999px; height: 34px; padding: 0 13px; cursor: pointer; font-weight: 700; }
.level-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid #ebe7df; }
.level-label { color: var(--muted); font-size: 13px; font-weight: 800; }
.level-btn { border: 1px solid var(--line); background: #fff; color: #57524b; border-radius: 6px; min-height: 30px; padding: 4px 10px; cursor: pointer; font-weight: 800; font-size: 13px; }
.level-btn.active { color: #fff; border-color: var(--accent); background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; max-height: 82px; overflow: hidden; }
.chips.open { max-height: none; }
.chip { border: 1px solid var(--line); background: var(--chip); color: #57524b; border-radius: 999px; padding: 6px 10px; cursor: pointer; font-weight: 700; font-size: 13px; }
.chip.active { color: #fff; border-color: var(--accent); background: var(--accent); }
.feed { background: #fff; }
.category { border-bottom: 1px solid var(--line); }
.category > summary,
.source > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px; border-top: 1px solid #ebe7df; }
.category > summary::-webkit-details-marker,
.source > summary::-webkit-details-marker { display: none; }
.category > summary { min-height: 48px; padding: 0 16px; background: #fbfbfb; }
.source > summary { min-height: 40px; padding: 0 16px 0 38px; background: #f7f7f8; }
.category:nth-of-type(2n) > summary { background: #f8fbfb; }
.caret { width: 18px; color: #8a8a8a; font-size: 13px; text-align: center; transform: rotate(0deg); transition: transform .12s ease; }
details[open] > summary .caret { transform: rotate(90deg); }
.cat-title { font-size: 20px; line-height: 1.15; font-weight: 850; }
.source-title { font-size: 17px; line-height: 1.2; font-weight: 800; color: #3a3a3a; }
.cat-count,
.source-count { color: #858585; font-weight: 800; white-space: nowrap; font-size: 18px; }
.article { display: grid; grid-template-columns: 1fr 90px; gap: 12px; padding: 8px 16px 8px 76px; border-top: 1px solid #ebe7df; background: #fff; }
.meta { display: none; }
.pill { border: 1px solid #dcdfe5; border-radius: 4px; padding: 2px 8px; background: #f7f8fa; color: #595f68; font-weight: 700; }
.pill.category-pill { color: #125fc9; border-color: #b9d4ff; background: #edf5ff; }
.title { display: block; font-size: 17px; line-height: 1.4; font-weight: 750; word-break: break-word; }
.time { color: #858585; font-size: 15px; font-weight: 700; text-align: right; padding-top: 4px; white-space: nowrap; }
.empty { padding: 30px 28px; color: var(--muted); text-align: center; }
.errors { padding: 10px 20px; color: var(--muted); font-size: 12px; background: #fffdfa; border-top: 1px solid var(--line); }
.errors details { cursor: pointer; }
@media (max-width: 820px) {
  .page { width: calc(100vw - 20px); margin-top: 10px; }
  .hero { padding: 20px 16px 14px; align-items: flex-start; }
  .hero h1 { font-size: 24px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat { border-bottom: 1px solid var(--line); }
  .controls { padding: 12px; }
  .category > summary { min-height: 52px; padding: 0 12px; }
  .source > summary { min-height: 44px; padding: 0 12px 0 38px; }
  .cat-title { font-size: 18px; }
  .source-title { font-size: 16px; }
  .cat-count, .source-count { font-size: 15px; }
  .article { grid-template-columns: 1fr; gap: 3px; padding: 9px 12px 10px 76px; }
  .time { text-align: left; font-size: 13px; }
  .title { font-size: 16px; }
}
</style>
</head>
<body>
<main class="page">
  <section class="shell">
    <header class="hero">
      <div>
        <h1>RSS 信号流</h1>
        <div class="sub">按 category 分组展示最近一天公众号 RSS 更新，生成时间：<span id="generatedAt"></span></div>
      </div>
      <div class="total"><span id="heroTotal">0</span> 条</div>
    </header>
    <section class="stats" id="stats"></section>
    <section class="controls">
      <div class="search-row">
        <input class="search" id="search" type="search" placeholder="搜索标题、公众号、分类内容">
        <button class="small-btn" id="resetBtn">重置</button>
        <button class="small-btn" id="dedupeBtn">去重</button>
      </div>
      <div class="chips" id="chips"></div>
      <button class="small-btn" id="moreBtn" style="margin-top:10px; display:none;">更多分类</button>
      <div class="level-row" id="levelControls" aria-label="展示层级">
        <span class="level-label">展示层级</span>
        <button class="level-btn" data-level="collapsed">全部收起</button>
        <button class="level-btn" data-level="source">展开到公众号</button>
        <button class="level-btn" data-level="article">展开到文章</button>
      </div>
    </section>
    <section class="feed" id="feed"></section>
    <section class="errors" id="errorBox"></section>
  </section>
</main>

const ARTICLES = PAYLOAD.articles;
const SUMMARY = PAYLOAD.summary;
const CATEGORIES = PAYLOAD.categories;
const FETCH_ERRORS = PAYLOAD.errors;
let activeCategory = "全部";
let showAllCategories = false;
displayLevel = "article";
let deduplicate = false;

const statsEl = document.getElementById("stats");
const feedEl = document.getElementById("feed");
const chipsEl = document.getElementById("chips");
const searchEl = document.getElementById("search");
const moreBtn = document.getElementById("moreBtn");
const resetBtn = document.getElementById("resetBtn");
const levelControls = document.getElementById("levelControls");
const dedupeBtn = document.getElementById("dedupeBtn");

document.getElementById("heroTotal").textContent = SUMMARY.article_count;
document.getElementById("generatedAt").textContent = SUMMARY.generated_at;

function stat(label, value, hint) {
  return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint || ""}</div></div>`;
}

statsEl.innerHTML = [
  stat("文章更新总数量", SUMMARY.article_count + " 条", "最近一天 RSS 条目"),
  stat("更新公众号数量", SUMMARY.updated_mp_count + " 个", "订阅公众号共 " + SUMMARY.mp_total + " 个"),
  stat("最新更新时间", SUMMARY.latest_update, SUMMARY.time_window),
  stat("分类 / 抓取状态", SUMMARY.category_count + " 类", "RSS 抓取异常 " + SUMMARY.fetch_error_count + " 个")
].join("");

function renderChips() {
  const sortedCategories = [...CATEGORIES].sort((a, b) => b.articles - a.articles);
  const visible = showAllCategories ? sortedCategories : sortedCategories.slice(0, 10);
  chipsEl.classList.toggle("open", showAllCategories);
  chipsEl.innerHTML = [
    `<button class="chip ${activeCategory === "全部" ? "active" : ""}" data-cat="全部">全部 <span>${SUMMARY.article_count}</span></button>`,
    ...visible.map(cat => `<button class="chip ${activeCategory === cat.name ? "active" : ""}" data-cat="${escapeAttr(cat.name)}">${escapeHtml(cat.name)} <span>${cat.articles}</span></button>`)
  ].join("");
  moreBtn.style.display = sortedCategories.length > 10 ? "inline-block" : "none";
  moreBtn.textContent = showAllCategories ? "收起分类" : "更多分类";
}

function renderLevelControls() {
  levelControls.querySelectorAll("[data-level]").forEach(button => {
    button.classList.toggle("active", button.dataset.level === displayLevel);
  });
}

function sortByGroupName(entries) {
  return entries.sort(([left], [right]) => left.localeCompare(right, "zh-CN", { numeric: true, sensitivity: "base" }));
}

function filterArticles() {
  const q = searchEl.value.trim().toLowerCase();
  let filtered = ARTICLES.filter(item => {
    const matchesCategory = activeCategory === "全部" || item.category === activeCategory;
    const haystack = `${item.title} ${item.mp_name} ${item.category}`.toLowerCase();
    return matchesCategory && (!q || haystack.includes(q));
  });
  // 去重：保留标题相同的文章中发布时间最早的
  if (deduplicate) {
    // 先按发布时间升序排序，确保最早的排在前面
    filtered.sort((a, b) => a.published_ts - b.published_ts);
    const seen = new Set();
    filtered = filtered.filter(item => {
      if (seen.has(item.title)) {
        return false;
      }
      seen.add(item.title);
      return true;
    });
  }
  return filtered;
}

function renderFeed() {
  const filtered = filterArticles();
  const groups = new Map();
  for (const item of filtered) {
    if (!groups.has(item.category)) groups.set(item.category, []);
    groups.get(item.category).push(item);
  }
  if (!filtered.length) {
    feedEl.innerHTML = `<div class="empty">没有匹配的文章</div>`;
    return;
  }
  feedEl.innerHTML = sortByGroupName(Array.from(groups.entries())).map(([category, rows]) => `
    <details class="category" ${displayLevel !== "collapsed" ? "open" : ""}>
      <summary>
        <span class="caret">›</span>
        <span class="cat-title">${escapeHtml(category)}</span>
        <span class="cat-count">${rows.length} 条</span>
      </summary>
      ${renderSources(category, rows)}
    </details>
  `).join("");
}

function renderSources(category, rows) {
  const sources = new Map();
  for (const item of rows) {
    if (!sources.has(item.mp_name)) sources.set(item.mp_name, []);
    sources.get(item.mp_name).push(item);
  }
  return sortByGroupName(Array.from(sources.entries())).map(([mpName, items]) => `
    <details class="source" ${displayLevel === "article" ? "open" : ""}>
      <summary>
        <span class="caret">›</span>
        <span class="source-title">${escapeHtml(mpName)}</span>
        <span class="source-count">${items.length} 条</span>
      </summary>
      ${items.map(item => article(item, category)).join("")}
    </details>
  `).join("");
}

function article(item) {
  const url = item.link || item.rssurl || "#";
  return `<article class="article">
    <div>
      <div class="meta">
        <span class="pill category-pill">${escapeHtml(item.category)}</span>
        <span class="pill">公众号</span>
        <span class="pill">分区: ${escapeHtml(item.category)}</span>
      </div>
      <a class="title" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>
    </div>
    <time class="time" datetime="${escapeAttr(item.published)}">${escapeHtml(relativeTime(item.published_ts))}</time>
  </article>`;
}

function relativeTime(ts) {
  const seconds = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  const minutes = Math.floor(seconds / 60);
  if (minutes < 1) return "刚刚";
  if (minutes < 60) return `${minutes}分钟前`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours}小时前`;
  return `${Math.floor(hours / 24)}天前`;
}

function renderErrors() {
  if (!FETCH_ERRORS.length) {
    document.getElementById("errorBox").style.display = "none";
    return;
  }
  document.getElementById("errorBox").innerHTML = `<details><summary>有 ${SUMMARY.fetch_error_count} 个 RSS 地址抓取异常，点击查看前 ${FETCH_ERRORS.length} 个</summary><div>${FETCH_ERRORS.map(escapeHtml).join("<br>")}</div></details>`;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
}
function escapeAttr(value) { return escapeHtml(value); }

chipsEl.addEventListener("click", event => {
  const btn = event.target.closest("[data-cat]");
  if (!btn) return;
  activeCategory = btn.dataset.cat;
  renderChips();
  renderFeed();
});
moreBtn.addEventListener("click", () => {
  showAllCategories = !showAllCategories;
  renderChips();
});
levelControls.addEventListener("click", event => {
  const btn = event.target.closest("[data-level]");
  if (!btn) return;
  displayLevel = btn.dataset.level;
  renderLevelControls();
  renderFeed();
});
resetBtn.addEventListener("click", () => {
  searchEl.value = "";
  activeCategory = "全部";
  deduplicate = false;
  dedupeBtn.classList.remove("active");
  renderChips();
  renderFeed();
});
searchEl.addEventListener("input", renderFeed);
dedupeBtn.addEventListener("click", () => {
  deduplicate = !deduplicate;
  dedupeBtn.classList.toggle("active", deduplicate);
  dedupeBtn.textContent = deduplicate ? "取消去重" : "去重";
  renderFeed();
});

renderChips();
renderLevelControls();
renderFeed();
renderErrors();
</script>
